sonar.projectKey=foundry
sonar.projectName=Foundry
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.typescript.tsconfigPaths=tsconfig.json
# Tailwind v4 allows nested @media inside @utility, and JSX names such as
# MDX and Icons.gitHub are deliberate.
sonar.issue.ignore.multicriteria=css-nesting,jsx-casing
sonar.issue.ignore.multicriteria.css-nesting.ruleKey=css:S8767
sonar.issue.ignore.multicriteria.css-nesting.resourceKey=src/**/*.css
sonar.issue.ignore.multicriteria.jsx-casing.ruleKey=typescript:S6770
sonar.issue.ignore.multicriteria.jsx-casing.resourceKey=src/**/*.tsx
